<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';

function vary(hex, dl = 0.06){
  const c = new THREE.Color(hex);
  c.offsetHSL((Math.random()-0.5)*0.02,(Math.random()-0.5)*0.1,(Math.random()-0.5)*dl);
  return c.getHex();
}
function pick(a){ return a[(Math.random()*a.length)|0]; }
function res(c,x,y,z){
  if(typeof c === 'function') return c(x,y,z);
  if(Array.isArray(c)) return pick(c);
  return c;
}
const lerp=(a,b,t)=>a+(b-a)*t;
const clamp01=v=>Math.min(1,Math.max(0,v));
function tableLerp(tab,x){
  if(x<=tab[0][0])return tab[0][1];
  for(let i=1;i<tab.length;i++){
    if(x<=tab[i][0]){
      const t=(x-tab[i-1][0])/(tab[i][0]-tab[i-1][0]);
      return lerp(tab[i-1][1],tab[i][1],t);
    }
  }
  return tab[tab.length-1][1];
}

function put(A,x,y,z,c){ A.push([Math.round(x),Math.round(y),Math.round(z),res(c,x,y,z)]); }
function box(A,x0,y0,z0,x1,y1,z1,c){
  for(let x=x0;x<=x1;x++)for(let y=y0;y<=y1;y++)for(let z=z0;z<=z1;z++)put(A,x,y,z,c);
}
function ell(A,cx,cy,cz,rx,ry,rz,c){
  for(let x=Math.floor(cx-rx);x<=Math.ceil(cx+rx);x++)
  for(let y=Math.floor(cy-ry);y<=Math.ceil(cy+ry);y++)
  for(let z=Math.floor(cz-rz);z<=Math.ceil(cz+rz);z++){
    const dx=(x-cx)/rx,dy=(y-cy)/ry,dz=(z-cz)/rz;
    if(dx*dx+dy*dy+dz*dz<=1)put(A,x,y,z,c);
  }
}
function stroke(A,p0,p1,w,c){
  const d=Math.hypot(p1[0]-p0[0],p1[1]-p0[1],p1[2]-p0[2]);
  const n=Math.max(1,Math.ceil(d*2.5));
  const wi=Math.max(1,Math.round(w));
  for(let i=0;i<=n;i++){
    const t=i/n;
    const px=lerp(p0[0],p1[0],t),py=lerp(p0[1],p1[1],t),pz=lerp(p0[2],p1[2],t);
    for(let dx=-wi;dx<=wi;dx++)for(let dy=-wi;dy<=wi;dy++)for(let dz=-wi;dz<=wi;dz++){
      if(dx*dx+dy*dy+dz*dz<=w*w+0.35)put(A,px+dx,py+dy,pz+dz,c);
    }
  }
}
function crescent(A,cx,cy,zs,R,rIn,offX,c){
  for(const z of zs)
  for(let px=Math.floor(cx-R-1);px<=Math.ceil(cx+R+offX+1);px++)
  for(let py=Math.floor(cy-R-1);py<=Math.ceil(cy+R+1);py++){
    const d1=Math.hypot(px-cx,py-cy);
    const d2=Math.hypot(px-(cx+offX),py-cy);
    if(d1<=R&&d2>=rIn)put(A,px,py,z,c);
  }
}
function dedupe(A){
  const m=new Map();
  for(const v of A)m.set(v[0]+','+v[1]+','+v[2],v);
  return [...m.values()];
}
function buildPart(A,opt={}){
  const V=dedupe(A);
  if(!V.length)return null;
  const geo=new THREE.BoxGeometry(1,1,1);
  const mat=opt.basic?new THREE.MeshBasicMaterial():new THREE.MeshLambertMaterial();
  const im=new THREE.InstancedMesh(geo,mat,V.length);
  const M=new THREE.Matrix4();const C=new THREE.Color();
  const p=opt.pivot||{x:0,y:0,z:0};
  V.forEach((v,i)=>{
    M.makeTranslation(v[0]-p.x,v[1]-p.y,v[2]-p.z);
    im.setMatrixAt(i,M);
    C.set(v[3]);
    im.setColorAt(i,C);
  });
  im.instanceMatrix.needsUpdate=true;
  if(im.instanceColor)im.instanceColor.needsUpdate=true;
  im.frustumCulled=false;
  const grp=new THREE.Group();
  grp.add(im);
  grp.position.set(p.x,p.y,p.z);
  return grp;
}

let renderer,scene,camera,controls,composer,bloomPass;
try{
  renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'});
}catch(e){

renderer.setPixelRatio(Math.min(window.devicePixelRatio,2));
renderer.setSize(innerWidth,innerHeight);
renderer.toneMapping=THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure=1.08;
document.body.appendChild(renderer.domElement);

scene.background=new THREE.Color(0x020208);

camera=new THREE.PerspectiveCamera(50,innerWidth/innerHeight,0.5,6000);

const glowTex=(()=>{
  const cv=document.createElement('canvas');cv.width=cv.height=128;
  const g=cv.getContext('2d');
  const gr=g.createRadialGradient(64,64,0,64,64,64);
  gr.addColorStop(0,'rgba(255,255,255,1)');
  gr.addColorStop(0.32,'rgba(255,255,255,0.32)');
  gr.addColorStop(1,'rgba(255,255,255,0)');
  g.fillStyle=gr;g.fillRect(0,0,128,128);
  const t=new THREE.CanvasTexture(cv);
  t.colorSpace=THREE.SRGBColorSpace;
  return t;
})();
function makeSprite(color,scale,opacity,pos,parent){
  const s=new THREE.Sprite(new THREE.SpriteMaterial({map:glowTex,color,transparent:true,opacity,
    blending:THREE.AdditiveBlending,depthWrite:false}));
  s.scale.setScalar(scale);
  s.position.copy(pos);
  (parent||scene).add(s);
  return s;
}

const starUniforms={uTime:{value:0},uPR:{value:Math.min(devicePixelRatio,2)}};
const starMat=new THREE.ShaderMaterial({
  uniforms:starUniforms,
  transparent:true,
  depthWrite:false,
  blending:THREE.AdditiveBlending,
  vertexShader:`
    attribute vec3 aColor;
    attribute float aSize;
    attribute float aPhase;
    uniform float uTime;
    uniform float uPR;
    varying vec3 vColor;
    void main(){
      vColor=aColor;
      float tw=0.72+0.28*sin(uTime*(0.6+fract(aPhase*0.13)*1.9)+aPhase*17.0);
      vec4 mv=modelViewMatrix*vec4(position,1.0);
      gl_PointSize=aSize*uPR*tw*(320.0/max(1.0,-mv.z));
      gl_Position=projectionMatrix*mv;
    }`,
  fragmentShader:`
    varying vec3 vColor;
    void main(){
      vec2 uv=gl_PointCoord-0.5;
      float d=length(uv);
      float a=smoothstep(0.5,0.0,d);
      a*=a;
      gl_FragColor=vec4(vColor,a);
    }`
});
function starSystem(positions,sizes,phases,colors){
  const g=new THREE.BufferGeometry();
  g.setAttribute('position',new THREE.BufferAttribute(positions,3));
  g.setAttribute('aColor',new THREE.BufferAttribute(colors,3));
  g.setAttribute('aSize',new THREE.BufferAttribute(sizes,1));
  g.setAttribute('aPhase',new THREE.BufferAttribute(phases,1));
  const p=new THREE.Points(g,starMat);
  p.frustumCulled=false;
  scene.add(p);
  return p;
}
function fillStarArrays(n,rMin,rMax,sMin,sMax,pal,system){
  const pos=new Float32Array(n*3),col=new Float32Array(n*3),
        siz=new Float32Array(n),pha=new Float32Array(n);
  const v=new THREE.Color();
  for(let i=0;i<n;i++){
    const dir=new THREE.Vector3().randomDirection();
    if(Math.abs(dir.y)>0.85)dir.y*=0.4;
    dir.normalize().multiplyScalar(lerp(rMin,rMax,Math.cbrt(Math.random())));
    pos[i*3]=dir.x;pos[i*3+1]=dir.y;pos[i*3+2]=dir.z;
    v.set(pick(pal)).multiplyScalar(lerp(0.55,1.05,Math.random()));
    col[i*3]=v.r;col[i*3+1]=v.g;col[i*3+2]=v.b;
    siz[i]=lerp(sMin,sMax,Math.pow(Math.random(),1.6));
    pha[i]=Math.random()*100;
  }
  return system(pos,siz,pha,col);
}
fillStarArrays(5200,750,1600,3,10,[0xffffff,0xffffff,0xdfe8ff,0xcfe0ff,0xffe9c8,0xaac4ff,0xffc9d8,0x9ffcff],starSystem);
fillStarArrays(400,75,340,0.8,2.2,[0x46558c,0x3b4a78,0x56669e],starSystem);
fillStarArrays(9000,1700,3200,1.6,6,[0xffffff,0xdfe8ff,0xcfe0ff,0xbcd0ff,0xffe9c8,0xaac4ff,0xd8b9ff],starSystem);

const bandTilt=new THREE.Group();
bandTilt.rotation.set(0.42,0,0.30);
scene.add(bandTilt);
{
  const n=3600;
  const pos=new Float32Array(n*3),col=new Float32Array(n*3),
        siz=new Float32Array(n),pha=new Float32Array(n);
  const v=new THREE.Color(),pal=[0x6b7fae,0x8a93c8,0xa89ec8,0xc8b89a,0x7f95c9,0xb9aecf];
  const gauss=()=> (Math.random()+Math.random()+Math.random())-1.5;
  for(let i=0;i<n;i++){
    const r=Math.sqrt(Math.random())*1450;
    const a=Math.random()*Math.PI*2;
    pos[i*3]=Math.cos(a)*r;
    pos[i*3+1]=gauss()*95;
    pos[i*3+2]=Math.sin(a)*r;
    v.set(pick(pal)).multiplyScalar(0.85);
    col[i*3]=v.r;col[i*3+1]=v.g;col[i*3+2]=v.b;
    siz[i]=lerp(2,7,Math.random());
    pha[i]=Math.random()*100;
  }
  const g=new THREE.BufferGeometry();
  g.setAttribute('position',new THREE.BufferAttribute(pos,3));
  g.setAttribute('aColor',new THREE.BufferAttribute(col,3));
  g.setAttribute('aSize',new THREE.BufferAttribute(siz,1));
  g.setAttribute('aPhase',new THREE.BufferAttribute(pha,1));
  const p=new THREE.Points(g,starMat);
  p.frustumCulled=false;
  bandTilt.add(p);
}

const nebulaGroup=new THREE.Group();
scene.add(nebulaGroup);
const NEB_COLORS=[0x7b2ff7,0xff2fb9,0x00e5cc,0x2f6bff,0xff7b2f,0x9d4edd,0x20c997,0xe05fd0,0x4361ee,0xf7a072,0xb5179e,0x48cae4,0xf72585,0x4cc9f0,0xffba08,0x7209b7,0x3a0ca3,0xff540a];
const nebulas=[];
for(let i=0;i<18;i++){
  const dir=new THREE.Vector3().randomDirection();

}

const galaxyRoot=new THREE.Group();
galaxyRoot.position.set(-330,150,-430);
galaxyRoot.rotation.set(1.02,0.45,0.18);
galaxyRoot.scale.setScalar(1.7);
scene.add(galaxyRoot);
const galaxySpin=new THREE.Group();
galaxyRoot.add(galaxySpin);
{

  for(let i=0;i<n;i++){
    const arm=i%3;

    v.multiplyScalar(lerp(1.15,0.75,Math.random()));

  }
  const g=new THREE.BufferGeometry();
  g.setAttribute('position',new THREE.BufferAttribute(pos,3));
  g.setAttribute('color',new THREE.BufferAttribute(col,3));
  const m=new THREE.PointsMaterial({size:2.6,vertexColors:true,transparent:true,opacity:0.95,

}

const galaxySpins=[];
function miniGalaxy(pos,scl,rx,ry,rz,tintA,tintB){
  const root=new THREE.Group();
  root.position.copy(pos);
  root.rotation.set(rx,ry,rz);
  root.scale.setScalar(scl);
  scene.add(root);
  const spin=new THREE.Group();
  root.add(spin);
  const n=1500;
  const posArr=new Float32Array(n*3),col=new Float32Array(n*3);
  const v=new THREE.Color(),cA=new THREE.Color(tintA),cB=new THREE.Color(tintB);
  for(let i=0;i<n;i++){
    const arm=i%2;
    const t=Math.pow(Math.random(),0.6)*2*Math.PI;
    const r=2.5+t*9.5;
    const spread=(1-clamp01(r/26))*0.5+0.08;
    const a=t*2+arm*Math.PI+(Math.random()-0.5)*spread*3;
    posArr[i*3]=Math.cos(a)*r+(Math.random()-0.5)*1.2;
    posArr[i*3+1]=(Math.random()+Math.random()+Math.random()-1.5)*(2.4*Math.exp(-r/17)+0.2);
    posArr[i*3+2]=Math.sin(a)*r+(Math.random()-0.5)*1.2;
    v.copy(cA).lerp(cB,clamp01(r/26)).multiplyScalar(lerp(0.7,1.15,Math.random()));
    col[i*3]=v.r;col[i*3+1]=v.g;col[i*3+2]=v.b;
  }
  const g=new THREE.BufferGeometry();
  g.setAttribute('position',new THREE.BufferAttribute(posArr,3));
  g.setAttribute('color',new THREE.BufferAttribute(col,3));
  const p=new THREE.Points(g,new THREE.PointsMaterial({size:2.4,vertexColors:true,transparent:true,
    opacity:0.9,blending:THREE.AdditiveBlending,depthWrite:false,sizeAttenuation:true}));
  p.frustumCulled=false;
  spin.add(p);
  makeSprite(tintA,26,0.32,new THREE.Vector3(0,0,0),spin);
  galaxySpins.push({spin,sp:lerp(0.02,0.07,Math.random())});
}
{

const audioState={enabled:false,ctx:null,master:null};
function initAudio(){
  const ctx=new (window.AudioContext||window.webkitAudioContext)();
  const master=ctx.createGain();
  master.gain.value=0;
  master.connect(ctx.destination);
  const omBus=ctx.createGain();
  omBus.gain.value=1;
  omBus.connect(master);
  const F0=108;
  const voice=ctx.createGain();voice.gain.value=1;
  // dry body: always audible
  const dry=ctx.createGain();dry.gain.value=0.5;
  voice.connect(dry);dry.connect(omBus);
  // vowel color
  const out=ctx.createGain();out.gain.value=0.9;
  [[300,4,1],[800,6,0.7],[1300,8,0.35],[2500,10,0.18]].forEach(([f,q,g0])=>{
    const bp=ctx.createBiquadFilter();
    bp.type='bandpass';bp.frequency.value=f;bp.Q.value=q;
    const fg=ctx.createGain();fg.gain.value=g0;
    voice.connect(bp);bp.connect(fg);fg.connect(out);
  });
  out.connect(omBus);
  // breath swell
  const breath=ctx.createOscillator();breath.frequency.value=0.11;
  const breathG=ctx.createGain();breathG.gain.value=0.12;
  breath.connect(breathG);breathG.connect(voice.gain);breath.start();
  // vibrato on fundamental
  const vib=ctx.createOscillator();vib.frequency.value=4.6;
  const vibG=ctx.createGain();vibG.gain.value=2;
  vib.connect(vibG);vib.start();
  // harmonic stack (sawtooth-ish via additive)
  [1,2,3,4,5,6,8].forEach(h=>{
    const o=ctx.createOscillator();o.type='sine';
    o.frequency.value=F0*h;
    o.detune.value=(Math.random()-0.5)*6;
    const vg=ctx.createGain();
    vg.gain.value=[0.85,0.45,0.3,0.2,0.13,0.09,0.05][[1,2,3,4,5,6,8].indexOf(h)];
    o.connect(vg);vg.connect(voice);o.start();
    if(h===1)vibG.connect(o.frequency);
  });
  // sub octave rumble
  const sub=ctx.createOscillator();sub.type='sine';sub.frequency.value=F0/2;
  const subG=ctx.createGain();subG.gain.value=0.3;
  sub.connect(subG);subG.connect(omBus);sub.start();
  audioState.ctx=ctx;audioState.master=master;
}
function playBell(){
  if(!audioState.ctx)return;
  const ctx=audioState.ctx,t=ctx.currentTime;
  [[136.1,0.4],[136.1*2.02,0.18],[136.1*3.01,0.08]].forEach(([f,g0])=>{
    const o=ctx.createOscillator();o.type='sine';
    o.frequency.setValueAtTime(f,t);
    o.frequency.exponentialRampToValueAtTime(f*0.985,t+4.2);
    const g=ctx.createGain();
    g.gain.setValueAtTime(0.0001,t);
    g.gain.exponentialRampToValueAtTime(g0,t+0.02);
    g.gain.exponentialRampToValueAtTime(0.0001,t+4.5);
    o.connect(g);g.connect(audioState.master);
    o.start(t);o.stop(t+4.6);
  });
}
document.getElementById('sndbtn').addEventListener('click',()=>{
  try{
    if(!audioState.ctx)initAudio();
    if(audioState.ctx.state==='suspended')audioState.ctx.resume();
    audioState.enabled=!audioState.enabled;
    const now=audioState.ctx.currentTime;
    audioState.master.gain.cancelScheduledValues(now);
    audioState.master.gain.setValueAtTime(audioState.master.gain.value,now);
    audioState.master.gain.linearRampToValueAtTime(audioState.enabled?0.85:0,now+0.8);
    document.getElementById('sndbtn').textContent=audioState.enabled?'SOUND · ON':'SOUND · OFF';
  }catch(e){console.error('audio init failed:',e);}
});

function animate(){
  requestAnimationFrame(animate);
  const dt=Math.min(clock.getDelta(),0.05);
  const t=clock.elapsedTime;
  controls.autoRotate=wantAuto&&!document.hidden;
  controls.update();

  shiva.position.y=SHIVA_Y+Math.sin(t*0.85+1.3)*0.45;

  const br=Math.sin(t*1.15);
  gBody.scale.set(1+br*0.008,1+br*0.014,1+br*0.008);
  gHead.rotation.z=Math.sin(t*0.7)*0.03;
  gHead.rotation.y=Math.sin(t*0.45)*0.05;
  gArmFL.rotation.z=Math.sin(t*0.9)*0.02;
  gArmFR.rotation.z=-Math.sin(t*0.9+0.4)*0.02;
  damaruSpin.rotation.y+=dt*2.4;
  snakeHead.rotation.z=Math.sin(t*1.3)*0.14;
  snakeTongue.visible=Math.sin(t*5)>-0.2;

  eyeVal+=(eyeTarget-eyeVal)*Math.min(1,dt*2.6);
  const eo=eyeVal;
  eyeOpen.visible=eo>0.02;
  eyeOpen.scale.setScalar(0.4+0.6*eo);
  eyeLight.intensity=eo*4.5;
  browGlow.material.opacity=Math.max(eo*0.9,0.22+0.1*Math.sin(t*2.1));
  if(!fxLatch&&eo>0.42){
    fxLatch=true;
    chestMarker.getWorldPosition(tmpV);
    shock1.position.copy(tmpV);shock2.position.copy(tmpV);
    shock1.visible=shock2.visible=true;
    shockT1=0;shockT2=-0.15;
    bloomBoost=0.65;fovPunch=1;
    playBell();
    eyeMarker.getWorldPosition(tmpV);
    spawnBurst(tmpV,80,5,13,-2.5);
  }
  if(eo>0.9){
    emberTimer-=dt;
    if(emberTimer<=0){
      emberTimer=0.35;
      eyeMarker.getWorldPosition(tmpV);
      spawnBurst(tmpV,2,0.5,1.5,-1);
    }
  }

  if(shockT1>=0){
    shockT1+=dt/1.1;
    if(shockT1>=1){shockT1=-1;shock1.visible=false;}
    else{shock1.scale.setScalar(Math.max(0.01,shockT1*26));shockMat1.opacity=0.55*(1-shockT1);}
  }
  if(shockT2>-1){
    shockT2+=dt/1.3;
    if(shockT2>=1){shockT2=-1;shock2.visible=false;}
    else if(shockT2>0){shock2.scale.setScalar(Math.max(0.01,shockT2*18));shockMat2.opacity=0.45*(1-shockT2);}
  }

  bloomBoost*=Math.exp(-dt*1.8);
  bloomPass.strength=0.9+bloomBoost;
  fovPunch*=Math.exp(-dt*2.2);
  const targetFov=50+fovPunch*2.5;
  if(Math.abs(camera.fov-targetFov)>0.001){
    camera.fov=targetFov;
    camera.updateProjectionMatrix();
  }

  for(let i=0;i<GN;i++){
    const gd=gData[i];
    gd.t=(gd.t+dt*gd.sp)%1;
    const f=gd.t;
    gangaCurve.getPointAt(f,tmpV);
    gangaCurve.getTangentAt(f,tanV);
    tanV.cross(upV).normalize();
    tmpV.addScaledVector(tanV,Math.sin(gd.ph+t*3.2)*0.55*(1-f*0.35));
    tmpV.x+=gd.off;tmpV.z+=gd.off*0.6;
    gangaPos[i*3]=tmpV.x;gangaPos[i*3+1]=tmpV.y;gangaPos[i*3+2]=tmpV.z;
    const fade=1-THREE.MathUtils.smoothstep(f,0.93,1)*0.7;
    gangaCol[i*3]=lerp(0.35,1,f)*fade;
    gangaCol[i*3+1]=lerp(0.85,1,f)*fade;
    gangaCol[i*3+2]=lerp(0.93,1,f)*fade;
  }
  gangaGeo.attributes.position.needsUpdate=true;
  gangaGeo.attributes.color.needsUpdate=true;

  const end=gangaCurve.getPoint(1);
  for(let i=0;i<SN;i++){
    const sd=sData[i];
    const life=((t*0.55)+sd.off)%1;
    const k=life*2.6;
    splashPos[i*3]=end.x+sd.vx*k*0.35;
    splashPos[i*3+1]=end.y+sd.vy*k-4.5*k*k;
    splashPos[i*3+2]=end.z+sd.vz*k*0.35;
    const fade=Math.pow(1-life,1.4)*0.9;
    splashCol[i*3]=fade;splashCol[i*3+1]=fade;splashCol[i*3+2]=Math.min(1,fade*1.15);
  }
  splashGeo.attributes.position.needsUpdate=true;
  splashGeo.attributes.color.needsUpdate=true;

  for(let i=0;i<MN;i++){
    const md=mData[i];
    const a=md.th+t*md.om;
    const y=((md.y0+t*md.vy)%34)-2;
    motePos[i*3]=Math.cos(a)*md.r;
    motePos[i*3+1]=y;
    motePos[i*3+2]=Math.sin(a)*md.r;
    const tw=0.55+0.45*Math.sin(t*2.2+i*1.7);
    moteCol[i*3]=md.c.r*tw;moteCol[i*3+1]=md.c.g*tw;moteCol[i*3+2]=md.c.b*tw;
  }
  moteGeo.attributes.position.needsUpdate=true;
  moteGeo.attributes.color.needsUpdate=true;

  for(let i=0;i<BN;i++){
    const b=bData[i];
    if(b.life<=0)continue;
    b.life-=dt;
    if(b.life<=0){burstPos[i*3+1]=-9999;burstCol[i*3]=burstCol[i*3+1]=burstCol[i*3+2]=0;continue;}
    b.vy+=b.grav*dt;
    burstPos[i*3]+=b.vx*dt;
    burstPos[i*3+1]+=b.vy*dt;
    burstPos[i*3+2]+=b.vz*dt;
    const sc=b.life/b.max;
    burstCol[i*3]=b.c.r*sc;burstCol[i*3+1]=b.c.g*sc;burstCol[i*3+2]=b.c.b*sc;
  }
  burstGeo.attributes.position.needsUpdate=true;
  burstGeo.attributes.color.needsUpdate=true;

  cometTheta+=dt*0.085;
  cometPoint(cometTheta,tmpV);
  cometHeadCore.position.copy(tmpV);
  cometHeadGlow.position.copy(tmpV);
  cometHistory.unshift(tmpV.clone());
  if(cometHistory.length>cometTrailN)cometHistory.pop();
  for(let i=0;i<cometTrailN;i++){
    const p=cometHistory[Math.min(i,cometHistory.length-1)];
    cometTrailPos[i*3]=p.x;cometTrailPos[i*3+1]=p.y;cometTrailPos[i*3+2]=p.z;
  }
  cometTrailGeo.attributes.position.needsUpdate=true;

  earth.rotation.y+=dt*0.12;
  moonPivot.rotation.y+=dt*0.25;
  giant.rotation.y+=dt*0.06;
  galaxySpin.rotation.y+=dt*0.03;
  for(const gs of galaxySpins)gs.spin.rotation.y+=dt*gs.sp;
  haloGroup.scale.setScalar(1+Math.sin(t*2.3)*0.008);

  for(const n of nebulas){
    n.m.rotation+=n.rot*dt;
    n.m.opacity=n.base*(0.8+0.2*Math.sin(t*n.sp+n.ph));
  }
  for(const o of oms){
    const a=o.ph+t*o.sp;
    o.spr.position.set(Math.cos(a)*o.r,o.h+Math.sin(t*0.4+o.ph)*2,Math.sin(a)*o.r);
    o.spr.material.rotation+=o.rot*dt;
  }

  starUniforms.uTime.value=t;

  composer.render();

  if(firstFrame){
    firstFrame=false;
    setTimeout(()=>{
      document.getElementById('loader').classList.add('done');
      document.body.classList.add('ready');
    },600);
  }
}
animate();

window.addEventListener('resize',()=>{
  camera.aspect=innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight);
  composer.setSize(innerWidth,innerHeight);
});
</script>
</body>
</html>
